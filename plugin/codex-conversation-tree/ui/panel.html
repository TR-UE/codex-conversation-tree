<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话树</title><style>
:root{color-scheme:light dark;--bg:#f7f9f3;--paper:#fff;--ink:#304536;--muted:#8c9c7e;--line:#e0e8d8;--green:#244f43;--soft:#edf3e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:6px 10px;font-size:11px}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid #91ac7f;outline-offset:2px}input,textarea,select{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px}select{max-width:100%;font-size:11px}textarea{line-height:1.9;resize:vertical;width:100%;min-height:210px}h1,h2,h3,p{margin:0}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:12px 17px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:flex;gap:9px;align-items:center}.logo{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:var(--green);color:#d8e7cd;font-size:21px}.brand strong{font-size:15px;font-weight:600}.brand small{display:block;color:var(--muted);font-size:9px}.tools{display:flex;gap:6px}.shell{min-height:540px;display:flex;flex-direction:column}.navigation{padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.navigation select{max-width:240px}.recording{margin-left:auto;font-size:9px;color:#759462;display:flex;gap:5px;align-items:center}.recording:before{content:"";width:5px;height:5px;border-radius:50%;background:#89a66f}.tabs{display:flex;gap:25px;padding:0 17px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:none;padding:10px 0;color:var(--muted);position:relative;font-size:11px}.tabs button.active{color:var(--green);font-weight:600}.tabs button.active:after{content:"";position:absolute;height:2px;background:var(--green);bottom:0;left:0;right:0}.workspace{display:grid;grid-template-columns:minmax(240px,.9fr) minmax(280px,1.1fr);min-height:450px;flex:1}.graph-side{padding:13px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:10px}.search{width:100%;font-size:11px}.graph{flex:1;overflow:auto;min-height:320px;max-height:calc(100vh - 200px);background-image:radial-gradient(#d9e3d2 1px,transparent 1px);background-size:18px 18px;border-radius:8px}.graph svg{display:block;min-width:100%}.node{cursor:pointer}.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.2}.node text{fill:var(--ink);font-family:inherit;pointer-events:none}.node.selected rect{fill:var(--green);stroke:var(--green)}.node.selected text{fill:#fff}.node.muted{opacity:.25}.node:hover rect{stroke:#93aa80;stroke-width:2}.edge{fill:none;stroke:#bbcdb1;stroke-width:1.5}.graph-footer{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted)}.graph-zoom{display:flex;gap:4px}.graph-zoom button{padding:2px 8px;font-size:10px}.detail{padding:18px 20px;overflow:auto;max-height:calc(100vh - 177px);min-height:420px;background:var(--paper)}.detail h2{font-size:16px;font-weight:550;margin-bottom:7px}.metadata{display:flex;gap:7px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin-bottom:19px}.tag{border-radius:4px;background:var(--soft);padding:2px 6px;font-size:9px;color:#839975}.tag.warn{background:#f8f0dc;color:#ac925d}.tag.pinned{background:#f7f0df;color:#b09a65}.label{font-size:9px;color:#91a27f;letter-spacing:1px;margin-bottom:7px}.question{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:13px;border-radius:0 10px 10px 10px;font-size:12px;margin-bottom:22px}.answer{overflow-wrap:anywhere;font-size:12px;line-height:1.95}.answer p{margin:0 0 12px}.answer h3{font-size:14px;margin:15px 0 7px}.answer ul,.answer ol{padding-left:21px}.answer pre{padding:11px;background:var(--soft);border-radius:7px;overflow:auto;font:10px/1.7 ui-monospace,monospace}.answer code{font:10px ui-monospace,monospace;background:var(--soft);padding:2px 4px;border-radius:3px}.answer table{border-collapse:collapse;width:100%;font-size:10px;margin:13px 0}.answer th,.answer td{border:1px solid var(--line);padding:6px}.answer th{background:var(--soft)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 13px;padding-top:16px;border-top:1px solid var(--line)}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#386b58}.notice{color:var(--muted);font-size:10px;line-height:1.9}.empty{padding:45px 20px;text-align:center;color:var(--muted);font-size:12px}.empty-symbol{width:60px;height:60px;display:grid;place-items:center;background:var(--soft);border-radius:18px;font-size:32px;margin:0 auto 18px;color:#9fb68a}.empty h3{font-size:16px;color:#69825a;font-weight:500;margin-bottom:8px}.memory{padding:20px;max-width:800px;margin:auto;width:100%}.memory-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.memory h2{font-size:16px;font-weight:550}.memory p{color:var(--muted);font-size:11px;margin:8px 0 15px}.memory .save-row{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.memory .save-row small{color:var(--muted);font-size:10px}.source-links{font-size:10px;color:var(--muted);margin-top:20px}.source-links button{display:block;margin-top:6px;max-width:100%;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.settings{padding:20px;font-size:11px;color:var(--muted)}.settings h3{font-size:13px;color:var(--ink);margin:12px 0}.settings pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:12px;border-radius:8px;font-size:10px}.sessions{margin-top:18px}.session{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:10px}.session span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.footer{padding:10px 16px;border-top:1px solid var(--line);font-size:9px;display:flex;justify-content:space-between;color:var(--muted);gap:12px}.hidden{display:none!important}.loading{padding:50px;text-align:center;color:var(--muted)}.error{padding:12px;border:1px solid #eadbcc;background:#fcf3e8;border-radius:8px;color:#a88565;font-size:11px;margin:12px 0}.branch-list{padding-top:16px;border-top:1px solid var(--line);margin-top:20px}.branch-list button{margin-top:8px;text-align:left}.branch-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.branch-row [data-open-thread]{flex:1}.branch-card{padding:14px 0;border-bottom:1px solid var(--line)}.branch-card strong{display:block;font-size:12px;color:var(--ink)}.branch-card p{font-size:10px;margin:5px 0 9px}.danger{color:#ae705b}.pruned{padding:20px}.pruned h2{font-size:16px}.pruned>p{font-size:11px;color:var(--muted);margin:8px 0 16px}.toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);background:#244f43ee;color:#fff;padding:9px 15px;border-radius:9px;font-size:11px;max-width:90%;z-index:20}dialog{width:min(520px,92vw);border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);padding:22px;max-height:85vh;overflow:auto}dialog::backdrop{background:#253f2b55}dialog h3{font-size:16px;font-weight:550;margin-bottom:16px}dialog label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}dialog input,dialog select{width:100%;margin-bottom:13px}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}dialog textarea{min-height:190px}.check-option{display:flex;gap:8px;align-items:center;margin:15px 0;color:var(--ink)}dialog .check-option input{width:auto;margin:0}.delete-range{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px}.delete-range ul{padding-left:19px;max-height:180px;overflow:auto;font-size:11px}.delete-range code{display:block;color:var(--muted);font-size:9px;overflow-wrap:anywhere}a{color:var(--green)}@media(max-width:590px){.workspace{grid-template-columns:1fr}.graph-side{border-right:0;border-bottom:1px solid var(--line)}.graph{min-height:210px;max-height:290px}.detail{max-height:none;min-height:180px}.shell{min-height:500px}.top{padding:12px}.navigation{padding:10px 12px}.brand small{font-size:8px}.recording{font-size:8px}.navigation select{max-width:190px}.footer{font-size:8px}.graph-side{padding:12px}.detail{padding:17px}.memory{padding:17px}}@media(prefers-color-scheme:dark){:root{--bg:#202720;--paper:#262f26;--ink:#d6e2ce;--muted:#98aa8b;--line:#3a4735;--green:#a5c499;--soft:#303c2c}.logo,.primary,.node.selected rect{background:#385a42;fill:#385a42;border-color:#385a42;color:#e3eddd}.node.selected text{fill:#fff}.tabs button.active{color:#b5cba9}.graph{background-image:radial-gradient(#3d4b35 1px,transparent 1px)}}
.main-path{padding:0 16px 10px;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}.node.main-path-node rect{stroke:#7e9c67;stroke-width:2}.path-controls{margin-top:14px}.main-path .tag{color:var(--green)}</style></head><body>
<header class="top"><div class="brand"><span class="logo">⌘</span><div><strong>对话树</strong><small>保留路径，让记忆生根</small></div></div><div class="tools"><button id="refresh" aria-label="刷新">↻</button><button id="expand">展开 ↗</button></div></header>
<div class="shell"><div class="navigation"><select id="tree-picker" aria-label="选择对话树"><option>正在读取…</option></select><span id="recording" class="recording">连接本地记录</span></div><div id="main-path" class="main-path"></div><nav class="tabs"><button data-tab="tree" class="active">对话树</button><button data-tab="memory">树根记忆</button><button data-tab="pruned">已剪分支 <span id="pruned-count"></span></button><button data-tab="settings">记录状态</button></nav><div id="tree-view" class="workspace"><aside class="graph-side"><input id="search" class="search" placeholder="搜索提问或回答…" aria-label="搜索节点"><div id="graph" class="graph"><svg id="svg" role="group" aria-label="对话节点关系图"></svg></div><div class="graph-footer"><span id="stats">正在加载</span><div class="graph-zoom"><button id="minus" aria-label="缩小">−</button><button id="fit">适应</button><button id="plus" aria-label="放大">＋</button></div></div></aside><article id="detail" class="detail"><div class="loading">正在连接对话树…</div></article></div><section id="memory-view" class="memory hidden"><div class="memory-heading"><h2>树根记忆</h2><select id="memory-version" aria-label="记忆版本"></select></div><p>保存需要跨分支保留的目标、结论和规则。每次保存都会留下一个版本。</p><textarea id="memory-content" placeholder="记录值得整棵树保留的内容…" aria-label="树根记忆内容"></textarea><div class="save-row"><small id="memory-status">已保存在本机</small><button id="memory-save" class="primary">保存新版本</button></div><div id="sources" class="source-links"></div></section><section id="pruned-view" class="pruned hidden"></section><section id="settings-view" class="settings hidden"></section><footer class="footer"><span>数据保存在桌面 · 仅同步已关联的对话</span><span id="sync-status">等待连接</span></footer></div><dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={data:null,treeId:null,nodeId:null,branchId:null,tab:'tree',search:'',zoom:1,memoryVersion:null,dirty:false,memoryBase:null,host:null,bridgeReady:false};
function inline(text, n) {
  let result = esc(text);
  result = result.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, (_, label, href) => {
    const decoded = href.replaceAll('&amp;', '&');
    if (/^https?:\/\//.test(decoded)) return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    if (n?.workspace && decoded.startsWith(n.workspace + '/')) {
      const relative = decoded.slice(n.workspace.length + 1).replace(/:\d+$/, '');
      if (n.files.some(f => f.path === relative)) return `<a href="${esc(fileURL(n, relative, true))}">${label} ↓</a>`;
    }
    return label;
  });
  result = result.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return result;
}
function markdown(text, n) {
  const lines = String(text || '').split('\n'); let output = '', paragraph = [], list = null, code = null;
  const flush = () => { if (paragraph.length) { output += `<p>${paragraph.map(l => inline(l, n)).join('<br>')}</p>`; paragraph = []; } if (list) { output += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) { if (code !== null) { output += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = null; } else { flush(); code = []; } continue; }
    if (code !== null) { code.push(line); continue; }
    if (!line.trim()) { flush(); continue; }
    if (/^\s*#{1,6}\s/.test(line)) { flush(); output += `<h3>${inline(line.replace(/^\s*#{1,6}\s/, ''), n)}</h3>`; continue; }
    if (/^\s*>\s?/.test(line)) { flush(); output += `<blockquote>${inline(line.replace(/^\s*>\s?/, ''), n)}</blockquote>`; continue; }
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
      flush(); const cells = l => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
      output += `<table><thead><tr>${cells(line).map(c => `<th>${inline(c.trim(), n)}</th>`).join('')}</tr></thead><tbody>`; i++;
      while (i + 1 < lines.length && lines[i + 1].includes('|')) { output += `<tr>${cells(lines[++i]).map(c => `<td>${inline(c.trim(), n)}</td>`).join('')}</tr>`; }
      output += '</tbody></table>'; continue;
    }
    const match = line.match(/^\s*(?:([-*])|\d+\.)\s+(.*)$/);
    if (match) { const tag = match[1] ? 'ul' : 'ol'; if (paragraph.length || (list && list !== tag)) flush(); if (!list) { list = tag; output += `<${tag}>`; } output += `<li>${inline(match[2], n)}</li>`; continue; }
    if (list) flush(); paragraph.push(line);
  }
  flush(); if (code !== null) output += `<pre><code>${esc(code.join('\n'))}</code></pre>`; return output;
}

let next=1;const pending=new Map();
function request(method,params){const id=next++;return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{pending.delete(id);reject(Error('宿主请求超时：'+method));},15000);pending.set(id,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timeout);m.error?p.reject(Error(m.error.message)):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result'){const d=m.params?._meta?.panelData;if(d)setData(d);else void refresh();}if(m.method==='ui/notifications/host-context-changed'){S.host={...S.host,...m.params};}});
const localNames={tree_state:'state',link_thread:'link',fork_native_node:'fork',save_root_memory:'memory',mark_node:'pin',manage_branch:'branch',preview_native_deletion:'deletion_preview',delete_native_branch:'deletion_execute',tree_diagnostics:'diagnostics'};
async function tool(name,args={}){let r;if(window.parent===window){const response=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:localNames[name],args})});r=await response.json();if(!response.ok)throw Error(r.error);return r;}if(S.bridgeReady){r=await request('tools/call',{name,arguments:args});}else if(window.openai?.callTool){r=await window.openai.callTool(name,args);}else throw Error('当前面板还没有连上插件工具');if(r.isError)throw Error(r.content?.find(c=>c.type==='text')?.text||'工具调用失败');return r.structuredContent;}
let toastTimeout;function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').classList.add('hidden'),4500);}
const tree=()=>S.data?.tree,nodes=()=>tree()?.nodes||[],node=()=>nodes().find(n=>n.id===S.nodeId),memory=()=>tree()?.memories.find(m=>m.version===S.memoryVersion)||tree()?.memories.at(-1);
const status=n=>({completed:'已完成',interrupted:'已中断',running:'正在进行',waiting:'等待处理',starting:'准备中',failed:'未完成'}[n.status]||n.status);
const date=v=>new Date(v).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'});

const mainId=()=>tree()?.native?.mainThreadId||tree()?.native?.rootThreadId;
const pathFor=id=>tree()?.native?.paths?.find(p=>p.threadId===id);
function mainButton(id){const p=pathFor(id);if(!p||p.pruned||p.nativeDeletedAt)return '';return p.isMain?'<span class="tag">主分支</span>':'<button data-main-thread="'+id+'">设为主分支</button>';}
function pathControls(id){const p=pathFor(id);if(!p||p.pruned||p.nativeDeletedAt)return '';return '<div class="path-controls"><div class="label">当前路径：'+esc(p.title)+'</div><div class="actions">'+mainButton(id)+(p.isMain?'':'<button class="danger" data-prune="'+id+'">剪掉当前路径</button>')+'</div></div>';}
async function setMainBranch(id){try{setData(await tool('manage_branch',{treeId:S.treeId,operation:'promote',threadId:id}));toast('已设为主分支，原主线可以剪枝。');}catch(e){toast(e.message);}}
function isMainPath(n){return n.id!=='root'&&(n.nativeThreadId===mainId()||n.bindings?.some(b=>b.threadId===mainId()));}
function renderMain(){const p=pathFor(mainId());$('main-path').innerHTML=p?'<span class="tag">主分支</span><span>'+esc(p.title)+'</span><button data-open-thread="'+p.threadId+'">打开主分支 ↗</button>':'';}

function setData(data){if(!data)return;const previous=mainId(),changedTree=S.treeId!==data.tree?.id;S.data=data;S.treeId=data.tree?.id;if(S.branchId&&!data.tree?.native?.forks?.some(f=>f.threadId===S.branchId))S.branchId=null;if(changedTree||previous!==mainId()||(!S.branchId&&!nodes().some(n=>n.id===S.nodeId))){const own=nodes().filter(n=>n.nativeThreadId===mainId()).at(-1),shared=nodes().filter(n=>n.bindings?.some(b=>b.threadId===mainId())).at(-1);S.branchId=!own&&tree()?.native?.forks?.some(f=>f.threadId===mainId())?mainId():null;S.nodeId=S.branchId?null:(own||shared||nodes().at(-1))?.id||null;}render();}
async function refresh(){try{const d=await tool('tree_state',S.treeId?{treeId:S.treeId}:{});if(!S.data||d.version!==S.data.version||d.tree?.id!==tree()?.id)setData(d);$('sync-status').textContent='已同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'});}catch(e){$('sync-status').textContent='同步暂时断开';if(!S.data)$('detail').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
function select(id){S.branchId=null;S.nodeId=id||null;renderGraph();renderDetail();if(S.bridgeReady)void request('ui/update-model-context',{structuredContent:{treeId:S.treeId,selectedNodeId:S.nodeId},content:[{type:'text',text:S.nodeId?'对话树面板当前选择的节点：'+node()?.title:'对话树面板当前查看树根。'}]}).catch(()=>{});}
function render(){const t=tree();$('tree-picker').innerHTML=(S.data?.trees||[]).map(t=>'<option value="'+t.id+'">'+esc(t.title)+'</option>').join('')||'<option>尚未关联对话</option>';$('tree-picker').value=S.treeId||'';const live=S.data?.sessions.filter(s=>s.recording).length||0;$('recording').textContent=live?'正在同步 '+live+' 条原生对话':'尚未关联对话';renderMain();renderGraph();renderDetail();renderMemory();renderPruned();renderSettings();}

$('memory-content').oninput=()=>{if(!S.dirty)S.memoryBase=tree().memories.at(-1).version;S.dirty=true;$('memory-status').textContent='有修改尚未保存';};$('memory-version').onchange=()=>{if(S.dirty){$('memory-version').value=memory().version;toast('请先保存当前编辑。');return;}S.memoryVersion=Number($('memory-version').value);renderMemory();};$('memory-save').onclick=async()=>{try{const m=memory(),data=await tool('save_root_memory',{treeId:S.treeId,baseVersion:S.memoryBase,content:$('memory-content').value,sourceNodeIds:m.sourceNodeIds,materialVersion:m.version});S.dirty=false;S.memoryVersion=null;setData(data);toast('已保存新的记忆版本。');}catch(e){toast(e.message);}};
$('expand').onclick=async()=>{if(window.parent===window){toast('面板已在完整窗口中打开。');return;}try{if(S.bridgeReady)await request('ui/request-display-mode',{mode:'fullscreen'});else if(window.openai?.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'});else throw Error('宿主没有提供展开入口');}catch(e){toast(e.message);}};
(async()=>{if(window.parent===window){await refresh();}else{try{const initialized=await request('ui/initialize',{appInfo:{name:'conversation-tree',version:'0.4.4'},appCapabilities:{tools:{},availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});S.host=initialized;S.bridgeReady=true;window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();}catch(e){if(window.openai?.callTool)await refresh();else{$('detail').innerHTML='<div class="error">'+esc(e.message)+'。请通过插件入口打开此面板。</div>';}}}setInterval(()=>{if(!document.hidden)void refresh();},3000);})();
</script></body></html>
